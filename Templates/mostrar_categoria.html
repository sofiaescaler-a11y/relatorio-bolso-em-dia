<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mostrar categoria</title>
    <link rel="icon" href="{{ url_for('static', filename='uploads/logo-escuro.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/categoria.css') }}">
    <script src="{{ url_for('static', filename='js/alteracao_foto.js') }}" defer></script>

</head>
<body>
<div class="pagina-perfil">
    <aside class="menu-lateral">
        <img class="logo-perfil" src="static/uploads/logo-horizontal.png" alt="Bolso em Dia">

        <nav class="navegacao-perfil">
            <a href="#">
                <img src="static/uploads/perfil-dashboard.png" alt="">
                <span>Dashboard</span>
            </a>

            <a href="#" class="rendimentos-perfil">
                <img src="static/uploads/perfil-rendimentos.png" alt="">
                <span>Rendimentos</span>
            </a>

            <a href="#">
                <img src="static/uploads/perfil-despesas.png" alt="">
                <span>Despesas</span>
            </a>

            <a href="#">
                <img src="static/uploads/perfil-dia-trabalhado.png" alt="">
                <span>Dia Trabalhado</span>
            </a>

            <a href="#">
                <img src="static/uploads/perfil-servico-extra.png" alt="">
                <span>Serviço Extra</span>
            </a>

            <a href="#">
                <img src="static/uploads/perfil-relatorios.png" alt="">
                <span>Relatórios</span>
            </a>

            <a href="#">
                <img src="static/uploads/perfil-historico.png" alt="">
                <span>Histórico Semanal</span>
            </a>
        </nav>

        <a class="sair-perfil" href="login.html">
            <img src="static/uploads/perfil-sair.png" alt="">
            <span>Sair</span>
        </a>
    </aside>

    <main class="conteudo-perfil">
        <div class="perfil">
            <img src="static/uploads/perfil-usuario-topo.png">
            <div class="nome_email">
                <span class="nome">nome_usuario</span>
                <span class="email">email_usuario</span>
            </div>
        </div>

        <div class="linha"></div>

        <div class="informacao_categoria">
            <div class="cabecalho-rendimentos">
                <section class="titulo-perfil">
                    <p>Olá, <span>nome_usuario</span></p>
                    <h1>Categorias</h1>
                    <p>Confira suas categorias.</p>
                </section>


                <button class="btn-adicionar-rendimento" type="submit"> Adicionar categoria</button>
            </div>


            <section class="meus-rendimentos">

                <h2>Suas categorias</h2>

                <div class="filtros-tabela">
                    <div class="campo-busca">
                        <img class="icone-filtro" src="static/uploads/Icon.png" alt="icone de lupa">
                        <input type="text" placeholder="Buscar rendimentos por descrição...">
                    </div>
                </div>

                <div class="tabela-rendimentos-container">
                    <table class="tabela-rendimentos">
                        <thead>
                        <tr>
                            <th>Nome categoria</th>
                            <th>Tipo</th>
                            <th>Cor</th>
                            <th>Ícone</th>
                            <th>Ações</th>
                            <th>Modo</th>
                        </tr>
                        </thead>

                        <tbody id="tabela-rendimentos">

                        </tbody>

                    </table>
                </div>
            </section>
        </div>


    </main>
</body>
</html>
